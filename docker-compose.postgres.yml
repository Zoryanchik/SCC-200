version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: transport-postgres-local
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: transport
    ports:
      - "127.0.0.1:5011:5011"
    volumes:
      - transport-postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "port=5011"]
    networks:
      - scc200-net

  backend:
    build:
      context: ./transport-backend
      dockerfile: Dockerfile
    image: transport-backend:local
    container_name: transport-backend-local
    depends_on:
      - postgres
    environment:
      BUS_DB_DSN: "postgresql://pguser:pgpass@transport-postgres-local:5011/transport"
      TRAIN_DB_DSN: "postgresql://pguser:pgpass@transport-postgres-local:5011/transport"
      WALK_DB_DSN: "postgresql://pguser:pgpass@transport-postgres-local:5011/transport"
      OSRM_URL: "http://scc200-osrm:5012"
    ports:
      - "5050:5050"
    volumes:
      - ./transport-backend/cache:/app/cache
    networks:
      - scc200-net

  osrm:
    image: osrm/osrm-backend:5.26
    container_name: scc200-osrm
    # The OSRM service requires a preprocessed .osrm dataset mounted into /data.
    # Use the project's osrm/scripts or your own preprocessing to produce the
    # dataset (for example transport-backend/scripts/build_osrm.sh). By
    # default this compose file mounts ./osrm/data -> /data inside the
    # container; update the path as needed.
    environment:
      OSRM_DATA_PATH: /data/nw-england.osrm
    volumes:
      - ./osrm/data:/data
    ports:
      - "5012:5012"
    command: ["sh", "-c", "osrm-routed --algorithm mld -p 5012 ${OSRM_DATA_PATH}"]
    networks:
      - scc200-net

networks:
  scc200-net:
    driver: bridge

volumes:
  transport-postgres-data:
