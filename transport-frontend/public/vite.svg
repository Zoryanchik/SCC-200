<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Blue circular background -->
  <circle cx="100" cy="100" r="90" fill="#4A90E2"/>
  
  <!-- Bus icon -->
  <g fill="white">
    <!-- Bus body -->
    <rect x="50" y="70" width="100" height="60" rx="8" ry="8"/>
    
    <!-- Windows -->
    <rect x="60" y="80" width="35" height="25" rx="3" fill="#4A90E2"/>
    <rect x="105" y="80" width="35" height="25" rx="3" fill="#4A90E2"/>
    
    <!-- Wheels -->
    <circle cx="70" cy="135" r="8" fill="#4A90E2"/>
    <circle cx="130" cy="135" r="8" fill="#4A90E2"/>
    
    <!-- Front bumper -->
    <rect x="50" y="65" width="100" height="5" rx="2"/>
    
    <!-- Route sign on top -->
    <rect x="75" y="55" width="50" height="12" rx="3"/>
  </g>
</svg>